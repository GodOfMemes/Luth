name: Build

on:
  push:
    branches: [personal]
  pull_request:
    branches: [personal]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        #os: [windows-latest, ubuntu-latest]
        os: [windows-latest]
        config: [Debug, Release, Dist]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@v1.2.1
      with:
        vulkan-query-version: 1.3.296.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader
        vulkan-use-cache: true

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ninja-build \
          xorg-dev \
          libgl1-mesa-dev \
          libvulkan-dev

    - uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
      with:
        arch: x64

    - name: Configure Windows
      if: matrix.os == 'windows-latest'
      run: cmake --preset windows

    - name: Configure Linux
      if: matrix.os == 'ubuntu-latest'
      run: cmake --preset linux

    - name: Build Windows
      if: matrix.os == 'windows-latest'
      run: cmake --build build/windows --config ${{ matrix.config }} --parallel

    - name: Build Linux
      if: matrix.os == 'ubuntu-latest'
      run: cmake --build build/linux --config ${{ matrix.config }} --parallel

    - name: Run smoke tests (Windows)
      if: matrix.os == 'windows-latest'
      run: ctest --test-dir build/windows -C ${{ matrix.config }} -L smoke --output-on-failure

    - name: Run smoke tests (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: ctest --test-dir build/linux -C ${{ matrix.config }} -L smoke --output-on-failure

    - name: Upload Release artifacts
      if: matrix.os == 'windows-latest' && matrix.config == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: luth-release-x64
        retention-days: 14
        path: |
          bin/windows-x86_64/Release/Runtime/Luthien.exe
          bin/windows-x86_64/Release/Runtime/slang-*.dll
          bin/windows-x86_64/Release/Luth/Luth.lib

    - name: Upload Linux Release artifacts
      if: matrix.os == 'ubuntu-latest' && matrix.config == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: luth-release-linux-x64
        retention-days: 14
        path: |
          bin/linux-x86_64/Release/Runtime/Luthien
          bin/linux-x86_64/Release/Runtime/libslang-*.so*
          bin/linux-x86_64/Release/Luth/libLuth.a
