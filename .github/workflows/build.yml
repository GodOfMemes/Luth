name: Build

on:
  push:
    branches: [personal]
  pull_request:
    branches: [personal]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        config: [Debug, Release, Dist]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ninja-build \
          xorg-dev \
          libgl1-mesa-dev \
          libvulkan-dev

    - name: Configure Windows
      if: matrix.os == 'windows-latest'
      run: cmake --preset windows

    - name: Configure Linux
      if: matrix.os == 'ubuntu-latest'
      run: cmake --preset linux

    - name: Build Windows
      if: matrix.os == 'windows-latest'
      run: cmake --build build/windows --config ${{ matrix.config }} --parallel

    - name: Build Linux
      if: matrix.os == 'ubuntu-latest'
      run: cmake --build build/linux --config ${{ matrix.config }} --parallel

    - name: Run smoke tests (Windows)
      if: matrix.os == 'windows-latest'
      run: ctest --test-dir build/windows -C ${{ matrix.config }} -L smoke --output-on-failure

    - name: Run smoke tests (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: ctest --test-dir build/linux -C ${{ matrix.config }} -L smoke --output-on-failure

    - name: Upload Release artifacts
      if: matrix.os == 'windows-latest' && matrix.config == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: luth-release-x64
        retention-days: 14
        path: |
          bin/windows-x86_64/Release/Runtime/Luthien.exe
          bin/windows-x86_64/Release/Runtime/slang-compiler.dll
          bin/windows-x86_64/Release/Runtime/slang-glslang.dll
          bin/windows-x86_64/Release/Runtime/slang-glsl-module.dll
          bin/windows-x86_64/Release/Runtime/slang-rt.dll
          bin/windows-x86_64/Release/Luth/Luth.lib

    - name: Upload Linux Release artifacts
      if: matrix.os == 'ubuntu-latest' && matrix.config == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: luth-release-linux-x64
        retention-days: 14
        path: |
          bin/linux-x86_64/Release/Runtime/Luthien
          bin/linux-x86_64/Release/Runtime/libslang-compiler.so.0.2026.1.2
          bin/linux-x86_64/Release/Runtime/libslang-glslang-2026.1.2.so
          bin/linux-x86_64/Release/Runtime/libslang-glsl-module-2026.1.2.so
          bin/linux-x86_64/Release/Runtime/libslang-rt.so.0.2026.1.2
          bin/linux-x86_64/Release/Luth/libLuth.a
